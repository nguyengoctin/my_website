{{- $author := cond .IsNamedParams (.Get "author") (.Get 0) -}}
{{- $content := trim .Inner "\n\r " -}}
<blockquote class="custom-quote">
    <div class="quote-content">
        <div class="quote-text">{{ $content | markdownify }}</div>
    </div>
    {{- if $author -}}
    <footer class="quote-footer">
        <cite>— {{ $author }}</cite>
    </footer>
    {{- end -}}
</blockquote>
