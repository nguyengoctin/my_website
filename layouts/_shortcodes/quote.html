{{- $author := cond .IsNamedParams (.Get "author") (.Get 0) -}}
{{- $content := trim .Inner "\n\r " -}}
<blockquote class="custom-quote">
    <div class="quote-content">
        <span class="quote-mark quote-open">“</span><span class="quote-text">{{ $content | markdownify }}</span><span class="quote-mark quote-close">”</span>
    </div>
    {{- if $author -}}
    <footer class="quote-footer">
        <cite>— {{ $author }}</cite>
    </footer>
    {{- end -}}
</blockquote>
