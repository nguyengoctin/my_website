{{- define "title" -}}
    {{- .Params.Title | default .Title }} - {{ .Site.Title -}}
{{- end -}}

{{- define "content" -}}
    <div class="page single special">
        <h1 class="single-title animate__animated animate__pulse animate__faster">
            {{- .Title | emojify -}}
        </h1>

        {{- /* Content */ -}}
        <div class="content" id="content">
            {{- .Content -}}
        </div>
    </div>
{{- end -}}
