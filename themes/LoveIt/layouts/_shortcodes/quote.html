{{- $author := cond .IsNamedParams (.Get "author") (.Get 0) | default "Sưu tầm" -}}
{{- $content := trim .Inner "\n" -}}
<blockquote class="custom-quote" style="margin: 1.35rem 0; padding: 0.95rem 1.35rem; border-left: 4px solid #4d74eb; background: rgba(77, 116, 235, 0.05); border-radius: 0 6px 6px 0; text-align: left;">
    <p style="margin: 0 0 0.45rem 0; font-size: 1.125rem; line-height: 1.65; font-style: italic; color: #2c3e50; text-align: left;">"{{ $content }}"</p>
    <footer style="font-style: normal; text-align: right; font-weight: 600; color: #4d74eb; font-size: 0.9rem; margin-top: 0.35rem;">
        <cite style="font-style: normal;">— {{ $author }}</cite>
    </footer>
</blockquote>
