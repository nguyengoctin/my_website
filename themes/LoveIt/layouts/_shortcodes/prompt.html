{{- $title := cond .IsNamedParams (.Get "title") (.Get 0) | default "Prompt" -}}
{{- $content := trim .Inner "\n" -}}
<div class="prompt-box">
    <div class="prompt-header">
        <span class="prompt-title">
            <i class="fas fa-terminal"></i> {{ $title }}
        </span>
        <button type="button" class="prompt-copy-btn" title="Copy prompt" onclick="navigator.clipboard.writeText(this.closest('.prompt-box').querySelector('.prompt-content').innerText); const span=this.querySelector('span'); span.innerText='Copied!'; setTimeout(() => span.innerText='Copy', 2000);">
            <i class="far fa-copy"></i> <span>Copy</span>
        </button>
    </div>
    <div class="prompt-content">{{ $content }}</div>
</div>
