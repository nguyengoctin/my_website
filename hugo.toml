baseURL = "https://ngoctin.me/"

# Change the default theme to be used when building the site with Hugo
theme = "LoveIt"

# Website title
title = "Nguyen Ngoc Tin"

# Language code and name
languageCode = "en"
languageName = "English"
hasCJKLanguage = false

# Enable robots.txt, git commit info, and emoji
enableRobotsTXT = true
enableGitInfo = false
enableEmoji = true

# Outputs required for Lunr search indexing
[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML", "MarkDown"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]

# Menu config
[menu]
  [[menu.main]]
    weight = 1
    identifier = "posts"
    name = "Blog"
    url = "/posts/"
    title = "Blog Posts"
  [[menu.main]]
    weight = 2
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    title = "All Tags"
  [[menu.main]]
    weight = 3
    identifier = "categories"
    name = "Categories"
    url = "/categories/"
    title = "All Categories"

# Parameters config for LoveIt theme
[params]
  defaultTheme = "auto"
  dateFormat = "2006-01-02"
  title = "Nguyen Ngoc Tin"
  description = "Personal website and blog of Nguyen Ngoc Tin"

  # App config & Favicon
  [params.app]
    title = "Nguyen Ngoc Tin"
    noFavicon = false
    svgFavicon = "/favicon.svg"
    themeColor = "#ffffff"
    iconColor = "#4d74eb"

  # Author config
  [params.author]
    name = "Nguyen Ngoc Tin"
    email = "ngoctin.work@gmail.com"
    link = "https://github.com/ngoctinn"

  # Header config
  [params.header]
    desktopMode = "fixed"
    mobileMode = "auto"
    [params.header.title]
      logo = ""
      name = "Nguyễn Ngọc Tín"
      pre = ""
      post = ""
      typeit = false

  # Footer config
  [params.footer]
    enable = true
    hugo = false
    copyright = true
    author = true
    since = 2026
    license = '<a rel="license external nofollow noopener noreffer" href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank">CC BY-NC 4.0</a>'

  # Search config (using Lunr.js)
  [params.search]
    enable = true
    type = "lunr"
    contentLength = 4000
    placeholder = "Search..."
    maxResultLength = 10
    snippetLength = 30
    highlightTag = "em"
    absoluteURL = false

  # Home page config (Chip Huyen Style)
  [params.home]
    rss = 10
    [params.home.profile]
      enable = true
      avatarURL = "/images/avatar.jpg"
      social = false
      bio = """
## ABOUT

Hello, my name is **Nguyễn Ngọc Tín**. I’m a software engineer based in Ho Chi Minh City, Vietnam, holding an **Engineer in Information Technology** degree from Saigon University, majoring in **Information Systems**. As a recent graduate, I am actively focusing on **Backend Development** and **Cloud Infrastructure**.

My primary focus is building RESTful APIs, designing database schemas, and building systems on Cloud platforms. My core tech stack includes **Python, Java, TypeScript, FastAPI, PostgreSQL, Docker, and AWS**. I approach software development as a system problem-solver, believing that tools and technologies are secondary to a strong problem-solving mindset.

I’m a guy with a curious mind. I like to learn something new every day. Whenever I explore new tools, I rely on official documentation and always start from the core fundamentals to build solutions that are solid, effective, and maintainable. Technology is vast and constantly evolving, which keeps me grounded and reminded of how much more there is to discover.

This website serves as my personal knowledge base and digital garden — a space where I keep my study notes, architecture concepts, code snippets, and technical write-ups.

Outside of engineering, I spend my time reading books across various fields, including technology, science, psychology, and literature.

---

