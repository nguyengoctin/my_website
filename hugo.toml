baseURL = "https://ngoctin.me/"

# Change the default theme to be used when building the site with Hugo
theme = "LoveIt"

# Website title
title = "Nguyen Ngoc Tin"

# Language code and name
languageCode = "en"
languageName = "English"
hasCJKLanguage = false

# Enable robots.txt, git commit info, and emoji
enableRobotsTXT = true
enableGitInfo = false
enableEmoji = true

# Taxonomies
[taxonomies]
  category = "categories"
  tag = "tags"

# Outputs required for Lunr search indexing
[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML", "MarkDown"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]

# Menu config
[menu]
  [[menu.main]]
    weight = 1
    identifier = "roadmaps"
    name = "Roadmaps"
    title = "Learning Roadmaps"
    url = "/roadmaps/"

  [[menu.main]]
    weight = 1
    identifier = "roadmap-backend"
    parent = "roadmaps"
    name = "Backend"
    url = "/backend/"
    title = "Backend Developer Roadmap"

  [[menu.main]]
    weight = 2
    identifier = "roadmap-ai"
    parent = "roadmaps"
    name = "AI Engineer"
    url = "/ai-engineer/"
    title = "AI Engineer Roadmap"

  [[menu.main]]
    weight = 2
    identifier = "posts"
    name = "Blog"
    url = "/posts/"
    title = "Blog Posts"
  [[menu.main]]
    weight = 3
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    title = "All Tags"
  [[menu.main]]
    weight = 4
    identifier = "categories"
    name = "Categories"
    url = "/categories/"
    title = "All Categories"

# Parameters config for LoveIt theme
[params]
  defaultTheme = "auto"
  dateFormat = "2006-01-02"
  title = "Nguyễn Ngọc Tín"
  description = "Personal website and blog of Nguyen Ngoc Tin"
  images = ["/images/og-cover.png"]

  # App config & Favicon
  [params.app]
    title = "Nguyen Ngoc Tin"
    noFavicon = false
    svgFavicon = "/favicon.svg"
    themeColor = "#ffffff"
    iconColor = "#4d74eb"

  # Author config
  [params.author]
    name = "Nguyen Ngoc Tin"
    email = "ngoctin.work@gmail.com"
    link = "https://github.com/ngoctinn"

  # Header config
  [params.header]
    desktopMode = "fixed"
    mobileMode = "auto"
    [params.header.title]
      logo = ""
      name = "Nguyễn Ngọc Tín"
      pre = ""
      post = ""
      typeit = false

  # Footer config
  [params.footer]
    enable = true
    hugo = false
    copyright = true
    author = true
    since = 2026
    license = '<a rel="license external nofollow noopener noreffer" href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank">CC BY-NC 4.0</a>'

  # Search config (using Lunr.js)
  [params.search]
    enable = true
    type = "lunr"
    contentLength = 4000
    placeholder = "Search..."
    maxResultLength = 10
    snippetLength = 30
    highlightTag = "em"
    absoluteURL = false

  # Home page config (Chip Huyen Style)
  [params.home]
    rss = 10
    [params.home.profile]
      enable = true
      avatarURL = "/images/avatar.webp"
      social = false
      bio = """
## ABOUT

Hello, my name is **Nguyễn Ngọc Tín**. I'm a software engineer based in Ho Chi Minh City, Vietnam. I graduated from Saigon University with an **Engineer in Information Technology** degree, majoring in **Information Systems**.

I'm a curious guy. I like to learn something new every day, and lately that curiosity has been pulling me in two directions — building backend systems and figuring out how to make AI actually useful in real products. I spend most of my time writing APIs, designing databases, and tinkering with things like LLM applications, RAG pipelines, and AI agents. My go-to tools are **Python, Java, TypeScript, FastAPI, PostgreSQL, Docker, and AWS**, but I try not to get too attached to any specific stack. Tools come and go; understanding the fundamentals is what sticks.

Whenever I pick up something new, I start from official docs and first principles. No shortcuts, no skipping ahead. I care more about understanding *why* things work than just knowing *how* to use them.

This website is my digital garden — a place where I keep study notes, architecture concepts, code snippets, and technical write-ups as I learn.

Outside of engineering, I read across technology, science, psychology, and literature.

---

