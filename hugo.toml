"""

  # Social links config
  [params.social]
    GitHub = "ngoctinn"
    Linkedin = "tin-nguyen-ngoc-2453372a3"
    Email = "ngoctin.work@gmail.com"
    Phone = "0397662903"
    Facebook = "tin.nguyenngoc.56808"

  # Page config
  [params.page]
    hiddenFromHomePage = false
    hiddenFromSearch = false
    twemoji = false
    lightgallery = true
    ruby = false
    fraction = false
    fontawesome = false
    linkToMarkdown = true

    # Table of contents
    [params.page.toc]
      enable = true
      keepStatic = false
      auto = true

    # KaTeX math support
    [params.page.math]
      enable = true
      inlineLeftDelimiter = ""
      inlineRightDelimiter = ""
      blockLeftDelimiter = ""
      blockRightDelimiter = ""
      copyTex = true
      mhchem = true

    # Code block config
    [params.page.code]
      copy = true
      maxShownLines = 50
    [params.page.code.render]
      goat = true
      mermaid = true

    # Social share
    [params.page.share]
      enable = true
      X = true
      Facebook = true
      Telegram = true
      Linkedin = false

# Markup configuration in Hugo
[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = true
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 6

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5
