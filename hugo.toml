baseURL = "https://ngoctin.me/"

# Change the default theme to be used when building the site with Hugo
theme = "LoveIt"

# Website title
title = "Nguyen Ngoc Tin"

# Language code and name
languageCode = "en"
languageName = "English"
hasCJKLanguage = false

# Enable robots.txt, git commit info, and emoji
enableRobotsTXT = true
enableGitInfo = false
enableEmoji = true

# Taxonomies
[taxonomies]
  category = "categories"
  tag = "tags"

# Outputs required for Lunr search indexing
[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML", "MarkDown"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]

# Menu config
[menu]
  [[menu.main]]
    weight = 1
    identifier = "roadmaps"
    name = "Roadmaps"
    title = "Learning Roadmaps"
    url = "/roadmaps/"

  [[menu.main]]
    weight = 1
    identifier = "roadmap-backend"
    parent = "roadmaps"
    name = "Backend"
    url = "/backend/"
    title = "Backend Developer Roadmap"

  [[menu.main]]
    weight = 2
    identifier = "roadmap-ai"
    parent = "roadmaps"
    name = "AI Engineer"
    url = "/ai-engineer/"
    title = "AI Engineer Roadmap"

  [[menu.main]]
    weight = 2
    identifier = "posts"
    name = "Blog"
    url = "/posts/"
    title = "Blog Posts"

  [[menu.main]]
    weight = 3
    identifier = "cheatsheets"
    name = "Cheatsheets"
    url = "/cheatsheets/"
    title = "Technical Flipbook Cheatsheets"

  [[menu.main]]
    weight = 4
    identifier = "categories"
    name = "Topics"
    url = "/categories/"
    title = "All Categories and Tags"

  [[menu.main]]
    weight = 5
    identifier = "cv"
    pre = "<i class='fas fa-file-alt'></i>"
    name = "My CV"
    url = "/cv/"
    title = "Curriculum Vitae"

# Parameters config for LoveIt theme
[params]
  defaultTheme = "auto"
  dateFormat = "2006-01-02"
  title = "Nguyễn Ngọc Tín"
  description = "Personal website and blog of Nguyen Ngoc Tin"
  images = ["/images/og-cover.png"]

  # App config & Favicon
  [params.app]
    title = "Nguyen Ngoc Tin"
    noFavicon = false
    svgFavicon = "/favicon.svg"
    themeColor = "#ffffff"
    iconColor = "#4d74eb"

  # Author config
  [params.author]
    name = "Nguyen Ngoc Tin"
    email = "ngoctin.work@gmail.com"
    link = "https://github.com/ngoctinn"

  # Header config
  [params.header]
    desktopMode = "fixed"
    mobileMode = "auto"
    [params.header.title]
      logo = ""
      name = "Nguyễn Ngọc Tín"
      pre = ""
      post = ""
      typeit = false

  # Footer config
  [params.footer]
    enable = true
    hugo = false
    copyright = true
    author = true
    since = 2026
    license = '<a rel="license external nofollow noopener noreffer" href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank">CC BY-NC 4.0</a>'

  # Search config (using Lunr.js)
  [params.search]
    enable = true
    type = "lunr"
    contentLength = 4000
    placeholder = "Search..."
    maxResultLength = 10
    snippetLength = 30
    highlightTag = "em"
    absoluteURL = false

  # Home page config (Chip Huyen Style)
  [params.home]
    rss = 10
    [params.home.profile]
      enable = true
      avatarURL = ""
      social = false
      title = ""
      subtitle = "Two things are infinite, the universe and human stupidity; and I'm not sure about the universe. — Albert Einstein"
      typeit = true

  # Social links config
  [params.social]
    GitHub = "ngoctinn"
    Linkedin = "tin-nguyen-ngoc-2453372a3"
    Email = "ngoctin.work@gmail.com"
    Phone = "0397662903"
    Facebook = "tin.nguyenngoc.56808"

  # Page config
  [params.page]
    hiddenFromHomePage = false
    hiddenFromSearch = false
    twemoji = false
    lightgallery = true
    ruby = false
    fraction = false
    fontawesome = false
    linkToMarkdown = true

    # Table of contents
    [params.page.toc]
      enable = true
      keepStatic = false
      auto = true

    # KaTeX math support
    [params.page.math]
      enable = true
      inlineLeftDelimiter = ""
      inlineRightDelimiter = ""
      blockLeftDelimiter = ""
      blockRightDelimiter = ""
      copyTex = true
      mhchem = true

    # Code block config
    [params.page.code]
      copy = true
      maxShownLines = 50
    [params.page.code.render]
      goat = true
      mermaid = true

    # Social share
    [params.page.share]
      enable = true
      X = true
      Facebook = true
      Telegram = true
      Linkedin = false

# Markup configuration in Hugo
[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = true
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 6

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5
