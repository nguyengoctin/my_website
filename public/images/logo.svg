<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Background Gradient (Brand Blue) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#011e41" />
      <stop offset="100%" stop-color="#023e8a" />
    </linearGradient>
    
    <!-- Accent Gradient for the Letter N -->
    <linearGradient id="nGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#48cae4" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Subtle Drop Shadow for the Letter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Smooth Squircle / Rounded Rectangle -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#bgGrad)" />
  
  <!-- The Monogram 'N' -->
  <g filter="url(#glow)">
    <!-- Left stem -->
    <line x1="30" y1="28" x2="30" y2="72" stroke="url(#nGrad)" stroke-width="12" stroke-linecap="round" />
    <!-- Diagonal -->
    <line x1="30" y1="28" x2="70" y2="72" stroke="url(#nGrad)" stroke-width="12" stroke-linecap="round" />
    <!-- Right stem -->
    <line x1="70" y1="28" x2="70" y2="72" stroke="url(#nGrad)" stroke-width="12" stroke-linecap="round" />
  </g>
</svg>
